<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnipDeck</title>
    <link rel="stylesheet" href="../styles/popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h2>SnipDeck
        <img src = '../assets/icon.png' alt = 'icon' id = 'icon' width = '20' height = '20'>
        </h2>
        <div class="tabs">
            <button class="tab active" data-tab="snippets">Text</button>
            <button class="tab" data-tab="screenshots">Screenshots</button>
        </div>

        <div class="content-section active" data-tab="snippets">
        <input type="text" id="search-input" autocomplete = 'off' placeholder="Search snippets...">
        <input type="text" id="title-input" autocomplete = 'off' placeholder="Enter snippet title...">
        <textarea id="snippet-input" autcomplete = 'off' placeholder="Enter your snippet here..."></textarea>
        <button id="add-snippet">Add Snippet</button>
        <ul id="snippet-list">
        </ul>
        </div>

        <div class="content-section" data-tab="screenshots">
            <button id="capture-screenshot">
                <i class="fas fa-camera"></i>
                Capture Screenshot
            </button>
            <ul id="screenshot-list"></ul>
        </div>

    </div>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/storage.js"></script>
    <script src="../scripts/tabs.js"></script>
    <script src="../scripts/snippets.js"></script>
    <script src="../scripts/screenshots.js"></script>
    <script src="../scripts/main.js"></script>
    <script src = "../scripts/events.js"></script>
</body>
</html>
